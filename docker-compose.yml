version: "3.9"

services:
  bot:
    build: .
    image: grok-discord-bridge
    container_name: grok-discord-bridge
    restart: unless-stopped

    # Required for PulseAudio shared memory
    ipc: host
    privileged: false

    # Shared memory for Chromium + WebRTC voice
    # Bumped from 2gb → 4gb: Discord voice + two browser tabs need the headroom.
    # DO NOT add --disable-dev-shm-usage in bot.js — that would negate this.
    shm_size: "4gb"

    ports:
      - "6080:6080"   # noVNC web UI
      - "5900:5900"   # Raw VNC

    environment:
      # ── Discord ──────────────────────────────────────────────
      # Option A: Bot token (recommended) — gives slash commands + message reading
      DISCORD_TOKEN: "${DISCORD_TOKEN}"

      # Option B: Web login (if no bot token)
      DISCORD_EMAIL: "${DISCORD_EMAIL}"
      DISCORD_PASSWORD: "${DISCORD_PASSWORD}"

      # ── Milo's browser account ────────────────────────────────
      # The user token of the SECOND Discord account (Milo).
      # Get it from a logged-in browser console (see bot.js logs for instructions).
      # If set, Milo skips the login page entirely on every restart.
      MILO_TOKEN: "${MILO_TOKEN}"

      # Milo's Discord account ID (the browser session account, not the bot)
      MILO_ACCOUNT_ID: "${MILO_ACCOUNT_ID:-1504162446196080754}"

      # Your Discord user ID — only you can trigger Milo
      OWNER_ID: "${OWNER_ID:-712321588342816879}"

      # ── X.com / Grok ─────────────────────────────────────────
      X_USERNAME: "${X_USERNAME}"
      X_PASSWORD: "${X_PASSWORD}"

      # Exported cookies from x.com (JSON array format from Cookie-Editor extension)
      # Required for Grok voice tab. Without this, Grok tab is skipped.
      GROK_COOKIES: "${GROK_COOKIES}"

      # ── DeepSeek (persona text chat) ─────────────────────────
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"

      # ── Persona ───────────────────────────────────────────────
      PERSONA_NAME: "${PERSONA_NAME:-Milo}"
      PERSONA_PERSONALITY: "${PERSONA_PERSONALITY:-a chill friend who knows everything — witty, warm, never robotic}"

      # ── Permissions ───────────────────────────────────────────
      # Leave blank = everyone can see bot responses (but only OWNER_ID can trigger it)
      ALLOWED_USER_ID: "${ALLOWED_USER_ID:-}"

      # ── Channel names (for browser-only mode) ─────────────────
      VOICE_CHANNEL_NAME: "${VOICE_CHANNEL_NAME:-General}"

      # ── Audio ─────────────────────────────────────────────────
      PULSE_LATENCY_MSEC: "80"

      # ── Display ───────────────────────────────────────────────
      DISPLAY: ":99"
      NOVNC_PORT: "6080"

      # ── Chromium binary override (optional) ───────────────────
      # Only needed if you install a custom Chromium path in your Dockerfile.
      # CHROMIUM_PATH: "/usr/bin/chromium"

    volumes:
      # Persist browser profiles (stay logged in across restarts)
      - browser_profile:/root/.config/chromium
      - browser_profile:/root/.config/playwright

    # Security: drop unnecessary capabilities
    cap_add:
      - SYS_ADMIN   # needed for Chromium sandbox (or use --no-sandbox)
    cap_drop:
      - NET_RAW

volumes:
  browser_profile:
    driver: local
